<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISM Shop Health Cockpit</title>
<style>
  :root {
    --bg: #0b1120;
    --surface: #131c31;
    --surface-2: #19243d;
    --border: #263554;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #22c55e;
    --green-bg: rgba(34, 197, 94, 0.14);
    --amber: #f59e0b;
    --amber-bg: rgba(245, 158, 11, 0.16);
    --red: #ef4444;
    --red-bg: rgba(239, 68, 68, 0.16);
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    --sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header.topbar {
    height: 54px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 0.98rem;
    letter-spacing: -0.01em;
  }
  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    white-space: nowrap;
  }
  .pill.green { border-color: rgba(34, 197, 94, 0.5); background: var(--green-bg); color: #86efac; }
  .pill.amber { border-color: rgba(245, 158, 11, 0.55); background: var(--amber-bg); color: #fde68a; }
  .pill.red { border-color: rgba(239, 68, 68, 0.6); background: var(--red-bg); color: #fca5a5; }
  .pill.blue { border-color: rgba(56, 189, 248, 0.5); background: rgba(56, 189, 248, 0.14); color: #bae6fd; }
  input[type="date"], button {
    font-family: inherit;
    font-size: 0.78rem;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 5px 10px;
  }
  button {
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: rgba(56, 189, 248, 0.18);
    border-color: var(--accent);
    color: #e0f2fe;
  }
  button.subtle {
    padding: 3px 8px;
    font-size: 0.7rem;
    color: var(--muted);
    background: transparent;
  }
  button.subtle:hover { color: var(--text); }
  label.toggle {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--muted);
    font-size: 0.76rem;
    cursor: pointer;
  }
  .workspace {
    flex: 1;
    display: grid;
    grid-template-columns: 365px 1fr;
    min-height: 0;
  }
  .action-rail {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .rail-head {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .rail-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .rail-title {
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 600;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
  }
  .chip.active {
    background: rgba(56, 189, 248, 0.16);
    border-color: var(--accent);
    color: var(--text);
  }
  .rail-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .action-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 9px;
    padding: 10px 11px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .action-card.Critical { border-left-color: var(--red); }
  .action-card.High { border-left-color: var(--amber); }
  .action-card.Medium { border-left-color: var(--accent); }
  .action-card.Low { border-left-color: var(--muted); }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .card-badges {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .card-title {
    font-weight: 700;
    font-size: 0.86rem;
    line-height: 1.3;
  }
  .card-sub {
    color: var(--muted);
    font-size: 0.75rem;
    line-height: 1.35;
  }
  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 3px;
  }
  .card-actions {
    display: flex;
    gap: 6px;
  }
  .empty-queue {
    margin: auto 0;
    text-align: center;
    padding: 28px 16px;
    border: 1px dashed rgba(34, 197, 94, 0.45);
    background: var(--green-bg);
    border-radius: 10px;
    color: #bbf7d0;
  }
  .main-pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    padding: 14px 16px;
    gap: 14px;
  }
  .err-banner {
    display: none;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid var(--red);
    background: var(--red-bg);
    color: #fecaca;
    font-size: 0.8rem;
  }
  .gauge-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
    gap: 10px;
  }
  .gauge-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .gauge-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .gauge-title {
    font-size: 0.74rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .gauge-val-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }
  .gauge-val {
    font-size: 1.25rem;
    font-weight: 800;
    font-family: var(--mono);
  }
  .gauge-bar-track {
    height: 6px;
    background: #0b1222;
    border-radius: 999px;
    overflow: hidden;
  }
  .gauge-bar-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.25s ease;
  }
  .fill-green { background: var(--green); }
  .fill-amber { background: var(--amber); }
  .fill-red { background: var(--red); }
  .gauge-foot {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .gauge-driver {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .swimlane-panel {
    flex: 1;
    min-height: 280px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .swim-head {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    font-size: 0.71rem;
    color: var(--muted);
  }
  .leg-item { display: inline-flex; align-items: center; gap: 4px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .swim-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px 14px;
  }
  .timeline-grid {
    display: grid;
    grid-template-columns: 185px 1fr;
    align-items: stretch;
  }
  .ruler-track {
    position: relative;
    height: 24px;
    border-bottom: 1px solid var(--border);
  }
  .hour-tick {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--muted);
  }
  .hour-tick:first-child { transform: none; }
  .lane-section-label {
    grid-column: 1 / -1;
    margin: 10px 0 4px;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .lane-meta {
    padding: 7px 10px 7px 0;
    border-bottom: 1px solid rgba(38, 53, 84, 0.55);
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }
  .lane-name {
    font-weight: 600;
    font-size: 0.78rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
  }
  .lane-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .tag-chip {
    font-size: 0.64rem;
    padding: 1px 5px;
    border-radius: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .lane-track {
    position: relative;
    min-height: 40px;
    border-bottom: 1px solid rgba(38, 53, 84, 0.55);
    background: rgba(11, 17, 32, 0.35);
  }
  .break-band {
    position: absolute;
    top: 0;
    bottom: 0;
    background: repeating-linear-gradient(
      45deg,
      rgba(148, 163, 184, 0.08),
      rgba(148, 163, 184, 0.08) 6px,
      rgba(148, 163, 184, 0.03) 6px,
      rgba(148, 163, 184, 0.03) 12px
    );
    pointer-events: none;
  }
  .now-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--red);
    z-index: 3;
    pointer-events: none;
  }
  .job-block {
    position: absolute;
    top: 5px;
    bottom: 5px;
    border-radius: 6px;
    padding: 3px 6px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    font-size: 0.7rem;
    border: 1px solid rgba(255, 255, 255, 0.16);
    color: var(--text);
    z-index: 2;
    container-type: inline-size;
  }
  .job-block.active { background: rgba(34, 197, 94, 0.25); border-color: rgba(34, 197, 94, 0.7); }
  .job-block.scheduled { background: rgba(56, 189, 248, 0.2); border-color: rgba(56, 189, 248, 0.65); }
  .job-block.completed { background: rgba(148, 163, 184, 0.16); border-color: rgba(148, 163, 184, 0.4); color: var(--muted); }
  .job-block.dead_lift { background: rgba(239, 68, 68, 0.32); border-color: var(--red); }
  .job-block.overrun {
    background: repeating-linear-gradient(
      -45deg,
      rgba(245, 158, 11, 0.28),
      rgba(245, 158, 11, 0.28) 7px,
      rgba(239, 68, 68, 0.24) 7px,
      rgba(239, 68, 68, 0.24) 14px
    );
    border-color: var(--amber);
  }
  .job-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job-sub { font-size: 0.64rem; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .veh-info { display: inline-flex; flex-wrap: nowrap; gap: 4px; align-items: baseline; max-width: 100%; overflow: hidden; }
  .veh-color, .veh-model { font-weight: 600; }
  .veh-gen { font-size: 0.66rem; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 5px; white-space: nowrap; }
  .veh-plate { font-family: var(--mono); opacity: 0.9; }
  .veh-vin { font-family: var(--mono); color: var(--muted); }
  .action-card { container-type: inline-size; }
  @container (max-width: 240px) {
    .veh-vin, .veh-gen { display: none; }
  }
  @container (max-width: 150px) {
    .veh-year, .veh-plate { display: none; }
  }
  @media (max-width: 1200px) {
    .veh-vin, .veh-gen { display: none; }
  }
  @media (max-width: 720px) {
    .veh-year, .veh-plate { display: none; }
  }
  .unslotted-bar {
    padding: 8px 14px;
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    font-size: 0.74rem;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  @media (max-width: 1080px) {
    .shell { height: auto; overflow: visible; }
    .workspace { grid-template-columns: 1fr; }
    .action-rail { border-right: none; border-bottom: 1px solid var(--border); max-height: 420px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span>ISM Shop Cockpit</span>
      <span id="bottleneckPill" class="pill blue">Loading…</span>
      <span id="capacityMeta" class="pill">—</span>
    </div>
    <div class="controls">
      <input id="datePicker" type="date" aria-label="Snapshot Date">
      <button id="todayBtn" type="button">Today</button>
      <label class="toggle">
        <input id="autoToggle" type="checkbox" checked>
        Auto 30s
      </label>
      <button id="refreshBtn" class="primary" type="button">Refresh</button>
      <span id="updatedAt" style="color:var(--muted);font-size:0.74rem;font-family:var(--mono);">—</span>
      <a id="deskRootLink" href="#" target="_blank" rel="noopener noreferrer">Frappe Desk ↗</a>
    </div>
  </header>

  <div class="workspace">
    <aside class="action-rail">
      <div class="rail-head">
        <div class="rail-title-row">
          <span class="rail-title">Manager Action Queue</span>
          <div style="display:flex;gap:6px;align-items:center;">
            <span id="suppressedPill" class="pill" style="display:none;"></span>
            <span id="queueCountPill" class="pill green">0</span>
          </div>
        </div>
        <div class="filter-row" id="priorityFilters">
          <button class="chip active" data-prio="ALL" type="button">All</button>
          <button class="chip" data-prio="Critical" type="button">Critical</button>
          <button class="chip" data-prio="High" type="button">High</button>
          <button class="chip" data-prio="Medium" type="button">Medium</button>
        </div>
      </div>
      <div id="actionQueueList" class="rail-list"></div>
    </aside>

    <main class="main-pane">
      <div id="errBanner" class="err-banner"></div>
      <section id="gaugeGrid" class="gauge-grid"></section>

      <section class="swimlane-panel">
        <div class="swim-head">
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="rail-title">Dual-Resource Swimlane (Read-Only)</span>
            <span id="swimDateLabel" class="pill">—</span>
          </div>
          <div class="legend">
            <span class="leg-item"><span class="swatch" style="background:rgba(34,197,94,0.6);"></span>Active</span>
            <span class="leg-item"><span class="swatch" style="background:rgba(56,189,248,0.6);"></span>Scheduled</span>
            <span class="leg-item"><span class="swatch" style="background:rgba(239,68,68,0.75);"></span>Dead Lift &gt;30m</span>
            <span class="leg-item"><span class="swatch" style="background:rgba(245,158,11,0.75);"></span>&gt; P80 / Spillover</span>
            <span class="leg-item"><span class="swatch" style="background:rgba(148,163,184,0.4);"></span>Completed</span>
          </div>
        </div>
        <div id="swimBody" class="swim-body"></div>
        <div id="unslottedBar" class="unslotted-bar" style="display:none;"></div>
      </section>
    </main>
  </div>
</div>

<script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token") || "";
  let selectedDate = params.get("date") || "";
  let activeFilter = "ALL";
  let lastView = null;
  let refreshTimer = null;

  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");

  const safeHref = (url) => {
    const raw = String(url || "").trim();
    if (/^https?:\/\//i.test(raw) || raw.startsWith("/")) return raw;
    return "";
  };

  const ruleBadge = (rule) => {
    const map = {
      quote_needed: "Quote",
      quote_cold: "Follow-Up",
      parts_deficit: "Order Parts",
      parts_ready: "Parts Ready",
      dead_lift: "Dead Lift",
      unscheduled_ro: "Schedule",
      checkout_ready: "Checkout",
      synced_action: "Alert"
    };
    return map[rule] || "Action";
  };

  const prioColor = (prio) => {
    if (prio === "Critical") return "red";
    if (prio === "High") return "amber";
    return "blue";
  };

  function renderQueue(view) {
    const listEl = document.getElementById("actionQueueList");
    const countPill = document.getElementById("queueCountPill");
    const suppPill = document.getElementById("suppressedPill");
    const counts = view.action_counts || {};
    const items = (view.action_queue || []).filter(
      (it) => activeFilter === "ALL" || it.priority === activeFilter
    );

    countPill.textContent = String(counts.total || 0);
    countPill.className = "pill " + ((counts.critical || 0) > 0 ? "red" : ((counts.total || 0) > 0 ? "amber" : "green"));

    if ((counts.suppressed || 0) > 0) {
      suppPill.style.display = "inline-flex";
      suppPill.textContent = counts.suppressed + " snoozed";
    } else {
      suppPill.style.display = "none";
    }

    if (!items.length) {
      listEl.innerHTML =
        '<div class="empty-queue">' +
          '<div style="font-weight:700;font-size:0.9rem;margin-bottom:4px;">All Clear</div>' +
          '<div style="font-size:0.76rem;">No manager actions matching this filter.</div>' +
        '</div>';
      return;
    }

    listEl.innerHTML = items.map((it) => {
      const link = safeHref(it.deep_link);
      const linkHtml = link
        ? '<a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer" style="font-size:0.74rem;font-weight:600;">Open in Frappe ↗</a>'
        : '<span></span>';
      const dismissBtn = it.can_dismiss
        ? '<button type="button" class="subtle js-sync-btn" data-action="dismiss" data-key="' + esc(it.dedup_key) + '" data-title="' + esc(it.title) + '">Dismiss</button>'
        : '';
      const snoozeBtn = it.can_snooze
        ? '<button type="button" class="subtle js-sync-btn" data-action="snooze" data-key="' + esc(it.dedup_key) + '" data-title="' + esc(it.title) + '" data-dt="' + esc(it.reference_doctype || "") + '" data-dn="' + esc(it.reference_name || "") + '">Snooze 1h</button>'
        : '';
      const vehHtml = it.vehicle_info ? '<div class="card-sub">' + renderVehicleHtml(it.vehicle_info) + '</div>' : '';

      return (
        '<div class="action-card ' + esc(it.priority) + '">' +
          '<div class="card-top">' +
            '<div class="card-badges">' +
              '<span class="pill ' + prioColor(it.priority) + '">' + esc(it.priority) + '</span>' +
              '<span class="pill">' + esc(ruleBadge(it.rule)) + '</span>' +
            '</div>' +
            '<span style="font-family:var(--mono);font-size:0.7rem;color:var(--muted);">' + esc(it.age_display || "") + '</span>' +
          '</div>' +
          '<div class="card-title">' + esc(it.title) + '</div>' +
          vehHtml +
          '<div class="card-sub">' + esc(it.subtitle) + '</div>' +
          '<div class="card-foot">' +
            linkHtml +
            '<div class="card-actions">' + snoozeBtn + dismissBtn + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  function renderVehicleHtml(vi) {
    if (!vi || typeof vi !== "object") return "";
    const parts = [];
    if (vi.model_year) parts.push('<span class="veh-year">' + esc(vi.model_year) + '</span>');
    if (vi.color) parts.push('<span class="veh-color">' + esc(vi.color) + '</span>');
    if (vi.model) parts.push('<span class="veh-model">' + esc(vi.model) + '</span>');
    if (vi.vehicle_generation) parts.push('<span class="veh-gen">' + esc(vi.vehicle_generation) + '</span>');
    if (vi.license_plate) parts.push('<span class="veh-plate">· ' + esc(vi.license_plate) + '</span>');
    if (vi.vin) parts.push('<span class="veh-vin">· ' + esc(vi.vin) + '</span>');
    if (!parts.length) {
      const fallback = vi.display || vi.compact_display || "";
      return fallback ? '<span class="veh-info"><span class="veh-model">' + esc(fallback) + '</span></span>' : "";
    }
    return '<span class="veh-info">' + parts.join("") + '</span>';
  }

  function renderGauges(view) {
    const grid = document.getElementById("gaugeGrid");
    const gauges = view.gauges || [];
    grid.innerHTML = gauges.map((g) => {
      const maxVal = Number(g.max_value || 100);
      const num = g.numeric_value == null ? 0 : Math.max(0, Math.min(maxVal, Number(g.numeric_value)));
      const pct = maxVal > 0 ? Math.round((num / maxVal) * 100) : 0;
      const color = g.color || "green";
      const deltaTxt = (g.delta == null) ? "" : ((g.delta >= 0 ? "+" : "") + g.delta);
      const link = safeHref(g.link);
      const linkHtml = link
        ? '<a href="' + esc(link) + '" target="_blank" rel="noopener noreferrer" style="white-space:nowrap;">Report ↗</a>'
        : '';
      return (
        '<div class="gauge-card">' +
          '<div class="gauge-head">' +
            '<span class="gauge-title">' + esc(g.title) + '</span>' +
            '<span class="pill ' + esc(color) + '">' + esc(g.grade) + '</span>' +
          '</div>' +
          '<div class="gauge-val-row">' +
            '<span class="gauge-val">' + esc(g.value) + '</span>' +
            (deltaTxt ? '<span class="pill">' + esc(deltaTxt) + '</span>' : '') +
          '</div>' +
          '<div class="gauge-bar-track">' +
            '<div class="gauge-bar-fill fill-' + esc(color) + '" style="width:' + pct + '%;"></div>' +
          '</div>' +
          '<div class="gauge-foot">' +
            '<span class="gauge-driver" title="' + esc(g.driver) + '">' + esc(g.driver) + '</span>' +
            linkHtml +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  function renderBlocksHtml(blocks, swim) {
    const br = swim.break_band
      ? '<div class="break-band" title="' + esc(swim.break_band.label) + '" style="left:' + swim.break_band.left_pct + '%;width:' + swim.break_band.width_pct + '%;"></div>'
      : '';
    const nowLn = swim.now_marker_pct != null
      ? '<div class="now-line" style="left:' + swim.now_marker_pct + '%;"></div>'
      : '';
    const items = (blocks || []).map((b) => {
      const href = safeHref(b.deep_link);
      const tag = href ? "a" : "div";
      const attrs = href ? ' href="' + esc(href) + '" target="_blank" rel="noopener noreferrer"' : "";
      const vehSub = b.vehicle_info ? renderVehicleHtml(b.vehicle_info) : esc(b.sublabel);
      const tipVeh = (b.vehicle_info && (b.vehicle_info.display || b.vehicle_info.compact_display)) || b.sublabel || "";
      return (
        '<' + tag + attrs + ' class="job-block ' + esc(b.state || "scheduled") + '" ' +
          'style="left:' + Number(b.left_pct || 0) + '%;width:' + Number(b.width_pct || 4) + '%;" ' +
          'title="' + esc((b.label || "") + " — " + tipVeh + " [" + (b.status || "") + "]") + '">' +
          '<div class="job-title">' + esc(b.label) + '</div>' +
          '<div class="job-sub">' + vehSub + '</div>' +
        '</' + tag + '>'
      );
    }).join("");
    return br + nowLn + items;
  }

  function renderSwimlane(view) {
    const swim = view.swimlane || {};
    const body = document.getElementById("swimBody");
    document.getElementById("swimDateLabel").textContent = swim.date || view.date || "Today";

    const hoursHtml = (swim.hours || []).map((h) =>
      '<span class="hour-tick" style="left:' + Number(h.left_pct) + '%;">' + esc(h.label) + '</span>'
    ).join("");

    let rowsHtml = (
      '<div class="timeline-grid">' +
        '<div style="border-bottom:1px solid var(--border);font-size:0.7rem;color:var(--muted);padding-top:4px;">Resource</div>' +
        '<div class="ruler-track">' + hoursHtml + '</div>'
    );

    rowsHtml += '<div class="lane-section-label">Service Bays</div>';
    const bayLanes = swim.bay_lanes || [];
    if (!bayLanes.length) {
      rowsHtml += '<div style="grid-column:1/-1;color:var(--muted);padding:8px 0;">No active service bays configured.</div>';
    } else {
      rowsHtml += bayLanes.map((lane) => {
        const tagsHtml = (lane.tags || []).map((t) => '<span class="tag-chip">' + esc(t) + '</span>').join("");
        return (
          '<div class="lane-meta">' +
            '<div class="lane-name"><span>' + esc(lane.label) + '</span><span style="font-family:var(--mono);color:var(--muted);">' + esc(lane.utilization_pct) + '%</span></div>' +
            (tagsHtml ? '<div class="lane-tags">' + tagsHtml + '</div>' : '') +
          '</div>' +
          '<div class="lane-track">' + renderBlocksHtml(lane.blocks, swim) + '</div>'
        );
      }).join("");
    }

    rowsHtml += '<div class="lane-section-label">Technicians</div>';
    const techLanes = swim.tech_lanes || [];
    if (!techLanes.length) {
      rowsHtml += '<div style="grid-column:1/-1;color:var(--muted);padding:8px 0;">No active technicians found.</div>';
    } else {
      rowsHtml += techLanes.map((lane) => {
        const badge = lane.on_leave
          ? '<span class="pill amber" style="padding:1px 6px;font-size:0.64rem;">Leave</span>'
          : '<span style="font-family:var(--mono);color:var(--muted);">' + esc(lane.utilization_pct) + '%</span>';
        return (
          '<div class="lane-meta">' +
            '<div class="lane-name"><span>' + esc(lane.label) + '</span>' + badge + '</div>' +
          '</div>' +
          '<div class="lane-track">' + renderBlocksHtml(lane.blocks, swim) + '</div>'
        );
      }).join("");
    }
    rowsHtml += '</div>';
    body.innerHTML = rowsHtml;

    const unslotted = swim.unslotted_bay_ros || [];
    const bar = document.getElementById("unslottedBar");
    if (unslotted.length) {
      bar.style.display = "flex";
      bar.innerHTML = '<strong style="color:#fde68a;">In Bay Without Active Schedule Slot:</strong> ' +
        unslotted.map((r) => {
          const href = safeHref(r.desk_url);
          const vehText = r.vehicle_compact_display || r.vehicle_display || "";
          const label = esc(
            vehText ? (r.name + " · " + vehText + " (" + r.status + ")") : (r.name + " (" + r.status + ")")
          );
          return href
            ? '<a class="pill ' + (r.is_dead_lift ? "red" : "amber") + '" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + label + ' ↗</a>'
            : '<span class="pill ' + (r.is_dead_lift ? "red" : "amber") + '">' + label + '</span>';
        }).join(" ");
    } else {
      bar.style.display = "none";
      bar.innerHTML = "";
    }
  }

  function renderAll(view) {
    lastView = view;
    const cap = view.capacity || {};
    const bn = cap.bottleneck || "Balanced";
    const bnPill = document.getElementById("bottleneckPill");
    bnPill.textContent = bn;
    bnPill.className = "pill " + (bn === "Balanced" ? "green" : (bn === "No Capacity" ? "red" : "amber"));

    document.getElementById("capacityMeta").textContent =
      (cap.active_bays || 0) + " Bays · " + (cap.on_duty_techs || 0) + " Techs";

    const picker = document.getElementById("datePicker");
    if (view.date && !picker.value) {
      picker.value = view.date;
    }

    const deskUrl = safeHref((view.urls || {}).desk_root);
    const deskLink = document.getElementById("deskRootLink");
    if (deskUrl) {
      deskLink.href = deskUrl;
      deskLink.style.display = "inline";
    } else {
      deskLink.style.display = "none";
    }

    const now = new Date();
    document.getElementById("updatedAt").textContent = "Refreshed " + now.toTimeString().slice(0, 8);

    renderQueue(view);
    renderGauges(view);
    renderSwimlane(view);
  }

  async function loadSnapshot() {
    const errEl = document.getElementById("errBanner");
    const q = new URLSearchParams();
    if (selectedDate) q.set("date", selectedDate);
    try {
      const resp = await fetch("/api/cockpit/snapshot?" + q.toString(), {
        headers: { "X-Cockpit-Token": token }
      });
      const payload = await resp.json();
      if (!resp.ok || !payload.success) {
        throw new Error(payload.error || "Snapshot fetch failed (" + resp.status + ")");
      }
      errEl.style.display = "none";
      renderAll(payload);
    } catch (err) {
      errEl.style.display = "block";
      errEl.textContent = "Cockpit refresh error: " + (err && err.message ? err.message : String(err));
    }
  }

  async function postSync(btn) {
    const action = btn.getAttribute("data-action");
    const dedupKey = btn.getAttribute("data-key");
    const title = btn.getAttribute("data-title");
    const refDt = btn.getAttribute("data-dt") || null;
    const refDn = btn.getAttribute("data-dn") || null;
    btn.disabled = true;
    try {
      const resp = await fetch("/api/cockpit/action-sync", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Cockpit-Token": token
        },
        body: JSON.stringify({
          dedup_key: dedupKey,
          action: action,
          snooze_minutes: action === "snooze" ? 60 : undefined,
          title: title,
          reference_doctype: refDt,
          reference_name: refDn
        })
      });
      const data = await resp.json();
      if (!resp.ok || data.success === false) {
        throw new Error(data.error || "Sync failed");
      }
      await loadSnapshot();
    } catch (err) {
      const errEl = document.getElementById("errBanner");
      errEl.style.display = "block";
      errEl.textContent = "Action sync error: " + (err && err.message ? err.message : String(err));
      btn.disabled = false;
    }
  }

  function resetAutoTimer() {
    if (refreshTimer) {
      clearInterval(refreshTimer);
      refreshTimer = null;
    }
    if (document.getElementById("autoToggle").checked) {
      refreshTimer = setInterval(loadSnapshot, 30000);
    }
  }

  document.getElementById("refreshBtn").addEventListener("click", loadSnapshot);
  document.getElementById("autoToggle").addEventListener("change", resetAutoTimer);
  document.getElementById("datePicker").addEventListener("change", (ev) => {
    selectedDate = ev.target.value || "";
    loadSnapshot();
  });
  document.getElementById("todayBtn").addEventListener("click", () => {
    selectedDate = "";
    document.getElementById("datePicker").value = "";
    loadSnapshot();
  });
  document.getElementById("priorityFilters").addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-prio]");
    if (!btn) return;
    activeFilter = btn.getAttribute("data-prio") || "ALL";
    document.querySelectorAll("#priorityFilters .chip").forEach((el) => {
      el.classList.toggle("active", el === btn);
    });
    if (lastView) renderQueue(lastView);
  });
  document.getElementById("actionQueueList").addEventListener("click", (ev) => {
    const btn = ev.target.closest("button.js-sync-btn");
    if (btn) postSync(btn);
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "r" && !ev.metaKey && !ev.ctrlKey && !ev.altKey && document.activeElement.tagName !== "INPUT") {
      loadSnapshot();
    }
  });

  resetAutoTimer();
  loadSnapshot();
})();
</script>
</body>
</html>
